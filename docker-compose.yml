version: '3.8'
services:
  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: fs-ai
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5080:5080/udp"
      - "5080:5080/tcp"
      - "8021:8021/tcp"
      - "20000-20050:20000-20050/udp"
    volumes:
      - ./freeswitch_config:/usr/local/freeswitch/conf
    restart: always
