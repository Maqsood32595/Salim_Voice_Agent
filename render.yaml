services:
  - type: web
    name: salim-webassembly-voice-agent
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node --max-old-space-size=256 server/index.js
    envVars:
      - key: PORT
        value: 5090
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
